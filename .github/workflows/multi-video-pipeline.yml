name: multi-video-pipeline

on:
  workflow_dispatch:
    inputs:
      story_1:
        description: 'Story 1 Text'
        required: false
        type: string
      story_2:
        description: 'Story 2 Text'
        required: false
        type: string
      story_3:
        description: 'Story 3 Text'
        required: false
        type: string
      story_4:
        description: 'Story 4 Text'
        required: false
        type: string
      story_5:
        description: 'Story 5 Text'
        required: false
        type: string
      story_6:
        description: 'Story 6 Text'
        required: false
        type: string
      story_7:
        description: 'Story 7 Text'
        required: false
        type: string
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scavenge:
    name: scavenge
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Requirements
        run: pip install requests google-generativeai
      - name: Run AI Scavenger & Processor (Stage 1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_1: ${{ inputs.story_1 }}
          STORY_2: ${{ inputs.story_2 }}
          STORY_3: ${{ inputs.story_3 }}
          STORY_4: ${{ inputs.story_4 }}
          STORY_5: ${{ inputs.story_5 }}
          STORY_6: ${{ inputs.story_6 }}
          STORY_7: ${{ inputs.story_7 }}
        run: python pipeline/batch_router.py 1
      - name: Upload Workspace Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-workspace
          path: workspace/
          retention-days: 1

  render:
    name: render (${{ matrix.story_id }})
    needs: scavenge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        story_id: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Requirements
        run: pip install requests google-generativeai
      - name: Download Workspace Artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-workspace
          path: workspace
      - name: Run Creatomate Render for Story ${{ matrix.story_id }} (Stage 2)
        env:
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CREATOMATE_TEMPLATE_ID: ${{ secrets.CREATOMATE_TEMPLATE_ID }}
          TARGET_STORY_ID: ${{ matrix.story_id }}
        run: python pipeline/batch_router.py 2 ${{ matrix.story_id }}
      - name: Upload Render State
        uses: actions/upload-artifact@v4
        with:
          name: render-state-${{ matrix.story_id }}
          path: workspace/
          retention-days: 1

  publish:
    name: publish
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Requirements
        run: pip install requests google-generativeai google-api-python-client
      - name: Download All Render States
        uses: actions/download-artifact@v4
        with:
          path: workspace_all
      - name: Run Publishers & Uploaders (Stage 3)
        env:
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_ACCOUNTS_JSON: ${{ secrets.YOUTUBE_ACCOUNTS_JSON }}
          YTDLP_COOKIES_CONTENT: ${{ secrets.YTDLP_COOKIES_CONTENT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python pipeline/batch_router.py 3

