name: Master Architecture Pipeline

on:
  workflow_dispatch:
    inputs:
      story_1:
        description: 'Story 1 Text'
        required: false
        type: string
      story_2:
        description: 'Story 2 Text'
        required: false
        type: string
      story_3:
        description: 'Story 3 Text'
        required: false
        type: string
      story_4:
        description: 'Story 4 Text'
        required: false
        type: string
      story_5:
        description: 'Story 5 Text'
        required: false
        type: string
      story_6:
        description: 'Story 6 Text'
        required: false
        type: string
      story_7:
        description: 'Story 7 Text'
        required: false
        type: string

env:
  MALLOC_ARENA_MAX: 2

jobs:
  ai-processor:
    name: Phase 1 (AI Processing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install requests
      - name: Run AI Stage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_1: ${{ inputs.story_1 }}
          STORY_2: ${{ inputs.story_2 }}
          STORY_3: ${{ inputs.story_3 }}
          STORY_4: ${{ inputs.story_4 }}
          STORY_5: ${{ inputs.story_5 }}
          STORY_6: ${{ inputs.story_6 }}
          STORY_7: ${{ inputs.story_7 }}
        run: python pipeline/batch_router.py 1
      - uses: actions/upload-artifact@v4
        with:
          name: shared-workspace
          path: workspace/
          overwrite: true

  story-workers:
    name: Account ${{ matrix.story_id }} Worker
    needs: ai-processor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        story_id: [1, 2, 3, 4, 5, 6, 7]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies (ImageMagick for Text)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - uses: actions/download-artifact@v4
        with:
          name: shared-workspace
          path: workspace/
      - run: pip install requests edge-tts moviepy==1.0.3 Pillow==9.5.0 numpy==1.26.4 google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Render & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_ACCOUNTS_JSON: ${{ secrets.YOUTUBE_ACCOUNTS_JSON }}
          YTDLP_COOKIES_CONTENT: ${{ secrets.YTDLP_COOKIES_CONTENT }}
        run: python pipeline/batch_router.py ${{ matrix.story_id }}
