name: Pipeline Test

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Video URL to process"
        required: true
        default: "https://www.youtube.com/watch?v=J1WoNuemKOg"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp yt-dlp-ejs bgutil-ytdlp-pot-provider
      - run: |
          yt-dlp --version
          node --version
          ffmpeg -version
          ffprobe -version
      - run: |
          echo "Cloning and building bgutil HTTP server backend..."
          git clone --single-branch --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          npm ci
          npx tsc
          node build/main.js --port 4416 &
          cd ../..
      - run: |
          echo "Waiting for bgutil provider health check..."
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:4416/ping >/dev/null; then
              echo "bgutil provider is healthy."
              break
            fi
            echo "Waiting for bgutil provider... ($i/15)"
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:4416/ping >/dev/null; then
            echo "ERROR: bgutil provider failed to become healthy or died."
            exit 1
          fi
      - env:
          YTDLP_ENABLE_POT_PROVIDER: "true"
          YTDLP_POT_PROVIDER_URL: "http://127.0.0.1:4416"
          YOUTUBE_PLAYER_CLIENT: "mweb"
        run: python main.py "${{ github.event.inputs.source_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: processed-short
          path: output/
